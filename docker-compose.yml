services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ['--default-authentication-plugin=mysql_native_password']
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${WP_PORT:-8080}:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: '1'
      FOURWAY_FRONTEND_URL: ${FOURWAY_FRONTEND_URL:-http://localhost:5173}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${WP_PORT:-8080}');
        define('WP_SITEURL', 'http://localhost:${WP_PORT:-8080}');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FOURWAY_FRONTEND_URL', '${FOURWAY_FRONTEND_URL:-http://localhost:5173}');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/wp-content/themes/4way-headless:/var/www/html/wp-content/themes/4way-headless

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      FOURWAY_FRONTEND_URL: ${FOURWAY_FRONTEND_URL:-http://localhost:5173}
      WP_URL: http://localhost:${WP_PORT:-8080}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-4way-admin-password}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-support@4waysafety.com}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/wp-content/themes/4way-headless:/var/www/html/wp-content/themes/4way-headless
      - ./docker:/scripts:ro
    entrypoint: ['/bin/sh', '-c']
    command: ['sleep infinity']

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - wordpress
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_WP_URL: http://localhost:${WP_PORT:-8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  wp_data:
  frontend_node_modules:
